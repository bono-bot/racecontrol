[pytest]
# Repo-root pytest config for the racecontrol project.
#
# Scope intentionally narrow: only the F4 audit tests are in scope right
# now. Other test suites in this monorepo are currently driven by
# cargo test (Rust) or comms-link/test/run-all.sh (Node) — pytest is a new
# surface introduced by the functional-layer milestone F4.
#
# If you add additional Python tests in future (F1-F3 or F5 side), add
# their directories to `testpaths` below.
testpaths = tests/audit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Keep output terse but failing-test-friendly. -q silences the per-test
# dot; --tb=short gives a readable traceback without burying context.
addopts = -q --tb=short
