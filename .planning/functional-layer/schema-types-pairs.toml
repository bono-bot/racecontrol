# schema-types-check — cross-boundary type parity pairs
#
# Each [[pair]] entry declares one Rust struct whose fields the kiosk/web TS
# must reference before the value reaches rc-agent. The checker enumerates
# the Rust struct's required fields (fields without #[serde(default*)]) and
# verifies that each required field name appears literally (word-boundary
# match) in at least one of the listed TS files. Optional fields are skipped
# — they are allowed to be absent from TS if the caller trusts the Rust
# default. Unknown TS fields are NOT flagged; runtime serde
# #[deny_unknown_fields] catches those.
#
# Motivating incident: 2026-03-26 silent-drop of `ai_level`/`ai_cars` in
# kiosk's launch payload. Kiosk sent `ai_difficulty`, `ai_count` (raw) —
# neither matched `AcLaunchParams` field names. Game launched successfully
# because serde tolerated defaults and deny_unknown_fields was not yet
# enabled. Zero AI opponents / always Semi-Pro for unknown duration.
#
# Schema:
#   id            — pair identifier (logging / RED message target)
#   rust_file     — path relative to repo root, UTF-8
#   rust_struct   — exact name after "pub struct"
#   ts_files      — list of paths relative to repo root (any match counts)
#   severity      — "required" (any missing field = RED) | "informational"
#   catches       — one-line summary of historical bug this pair catches

[[pair]]
id = "ac_launch_params_kiosk"
rust_file = "crates/rc-agent/src/ac_launcher.rs"
rust_struct = "AcLaunchParams"
ts_files = [
    "kiosk/src/hooks/useSetupWizard.ts",
    "kiosk/src/lib/types.ts",
]
severity = "required"
catches = "2026-03-26 ai_difficulty/ai_count silent-drop class — kiosk-side type drift vs rc-agent AC launch boundary"

# --- D8 Phase 2 pairs ---
# Inventory types — Phase 361-01 cross-boundary, kiosk wizard + admin content drift
# page depend on exact field-name parity with rc-common (see rc-common docstring).

[[pair]]
id = "pod_inventory_kiosk"
rust_file = "crates/rc-common/src/inventory_types.rs"
rust_struct = "PodInventory"
ts_files = [
    "kiosk/src/lib/types.ts",
]
severity = "required"
catches = "Phase 361-01 PodInventory schema drift between /api/v1/pods/{id}/inventory and kiosk wizard filtering"

[[pair]]
id = "game_inventory_kiosk"
rust_file = "crates/rc-common/src/inventory_types.rs"
rust_struct = "GameInventory"
ts_files = [
    "kiosk/src/lib/types.ts",
]
severity = "required"
catches = "Phase 361-01 GameInventory — per-game installed content (cars/tracks) drift between rc-common and kiosk consumer"

[[pair]]
id = "ai_count_range_kiosk"
rust_file = "crates/rc-common/src/inventory_types.rs"
rust_struct = "AiCountRange"
ts_files = [
    "kiosk/src/lib/types.ts",
]
severity = "required"
catches = "AI grid size range — shared between rc-common (serde default: 0-23) and kiosk wizard UI bounds"

[[pair]]
id = "validity_error_kiosk"
rust_file = "crates/rc-common/src/inventory_types.rs"
rust_struct = "ValidityError"
ts_files = [
    "kiosk/src/lib/types.ts",
]
severity = "required"
catches = "Phase 361-01 HTTP 422 validity-error body shape — kiosk toasts depend on reason/suggestion/code triple"
