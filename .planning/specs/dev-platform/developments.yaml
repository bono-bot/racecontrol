  note: >-
    DMAIC/DMADV-tracked work-items ("Index Items" = Console "Initiatives").
    Phase states from current evidence (Index/PRs/§S-N). framework: DMAIC = improve
    an existing app · DMADV = new app/product (missing framework defaults to DMADV
    for back-compat). Freeze-gate: frozen items keep gate-side phases (Improve/Control
    or Design/Verify) = gated until Captain-unfreeze + first-INR pass. CTQ entries are
    TBD-Captain unless an enforced fact is cited. 2026-06-06: framework-aware +
    health/gate_state/ui added; the 8 "initiative-*" entries are the prototype
    first-INR-cluster seed (Captain's Console). apps.yaml active_developments back-links
    for the new initiatives are a follow-up (forward dev→app refs are valid).
    lifecycle defaults to active per SCHEMA (nothing is shipped-live pre-first-INR;
    the Console Finished view is empty by design until the bug-free bar passes).

