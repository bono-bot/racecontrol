<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>System Status — Racing Point</title>
<style>
  /* ── V3.1 self-hosted fonts (CSP allows same-origin only → /assets/fonts) ── */
  @font-face { font-family:'Chakra Petch'; font-style:normal; font-weight:600; font-display:swap; src:url('/assets/fonts/ChakraPetch-600.woff2') format('woff2'); }
  @font-face { font-family:'Chakra Petch'; font-style:normal; font-weight:700; font-display:swap; src:url('/assets/fonts/ChakraPetch-700.woff2') format('woff2'); }
  @font-face { font-family:'Montserrat'; font-style:normal; font-weight:400; font-display:swap; src:url('/assets/fonts/Montserrat-400.woff2') format('woff2'); }
  @font-face { font-family:'Montserrat'; font-style:normal; font-weight:600; font-display:swap; src:url('/assets/fonts/Montserrat-600.woff2') format('woff2'); }
  @font-face { font-family:'JetBrains Mono'; font-style:normal; font-weight:500; font-display:swap; src:url('/assets/fonts/JetBrainsMono-500.woff2') format('woff2'); }

  /* ── V3.1 design tokens (Racing Point · @rp/tokens) ── */
  :root {
    --rp-red:#E10600; --rp-red-deep:#B40500;
    --rp-asphalt:#0D0D0D; --rp-base:#1A1A1A; --rp-card:#1C1C1C; --rp-card-hi:#262626;
    --rp-border:#2A2A2A; --rp-border-hi:#3A3A3A;
    --rp-ink:#F2F2F2; --rp-ink-dim:#A8A8A8; --rp-gunmetal:#5A5A5A; --rp-ink-faint:#3F3F3F;
    --rp-green:#00D26A; --rp-amber:#FFB000; --rp-blue:#3B82F6;
    --rp-display:'Chakra Petch','Segoe UI',system-ui,sans-serif;
    --rp-body:'Montserrat',system-ui,-apple-system,sans-serif;
    --rp-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--rp-body);
    background: var(--rp-asphalt);
    color: var(--rp-ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--rp-red); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--rp-border);
    background: var(--rp-asphalt);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header h1 {
    font-family: var(--rp-display);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--rp-ink);
  }
  .header h1 span { color: var(--rp-red); }
  .header-tag {
    font-family: var(--rp-display);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--rp-red);
    border: 1px solid var(--rp-red);
    padding: 3px 8px;
    border-radius: 2px;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 12px;
    color: var(--rp-ink-dim);
  }
  .header-clock {
    font-family: var(--rp-mono);
    font-size: 13px;
    color: var(--rp-ink-dim);
    font-variant-numeric: tabular-nums;
  }
  .back-link { font-family: var(--rp-display); font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }

  .main { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }

  .section-label {
    font-family: var(--rp-display);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--rp-red);
    padding: 5px 10px;
    border-left: 3px solid var(--rp-red);
    background: rgba(225, 6, 0, 0.07);
    display: inline-block;
    margin: 28px 0 14px;
  }
  .section-label:first-child { margin-top: 0; }

  .server-card {
    background: var(--rp-card);
    border: 1px solid var(--rp-border);
    border-left: 3px solid var(--rp-red);
    border-radius: 6px;
    padding: 22px;
    margin-bottom: 8px;
  }
  .server-name {
    font-family: var(--rp-display);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .kv-grid {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .kv-label {
    font-family: var(--rp-display);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--rp-gunmetal);
  }
  .kv-value {
    font-size: 14px;
    font-family: var(--rp-mono);
    color: var(--rp-ink-dim);
    margin-top: 3px;
  }

  .pod-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
    margin-bottom: 8px;
  }
  .pod-card {
    background: var(--rp-card);
    border: 1px solid var(--rp-border);
    border-radius: 6px;
    padding: 16px;
    transition: border-color 0.15s ease-out;
  }
  .pod-card:hover { border-color: var(--rp-border-hi); }
  .pod-card.offline { border-left: 3px solid var(--rp-red); }
  .pod-card.online { border-left: 3px solid var(--rp-green); }
  .pod-card.partial { border-left: 3px solid var(--rp-amber); }
  .pod-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .pod-name {
    font-family: var(--rp-display);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pod-ip {
    font-size: 11px;
    color: var(--rp-gunmetal);
    font-family: var(--rp-mono);
  }
  .pod-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .pod-detail {
    font-size: 11px;
    color: var(--rp-gunmetal);
    font-family: var(--rp-mono);
  }
  .pod-detail b { color: var(--rp-ink-dim); font-weight: 600; }
  .pod-badges {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .badge {
    font-family: var(--rp-display);
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 2px;
  }
  .badge-ok { background: rgba(0,210,106,0.15); color: var(--rp-green); border: 1px solid rgba(0,210,106,0.3); }
  .badge-warn { background: rgba(255,176,0,0.15); color: var(--rp-amber); border: 1px solid rgba(255,176,0,0.3); }
  .badge-err { background: rgba(225,6,0,0.15); color: var(--rp-red); border: 1px solid rgba(225,6,0,0.3); }

  .svc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    margin-bottom: 8px;
  }
  .svc-card {
    background: var(--rp-card);
    border: 1px solid var(--rp-border);
    border-radius: 6px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .svc-name {
    font-family: var(--rp-display);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
    text-transform: uppercase;
  }
  .svc-latency {
    font-size: 12px;
    font-family: var(--rp-mono);
    color: var(--rp-ink-dim);
  }
  .svc-meta {
    font-size: 11px;
    color: var(--rp-gunmetal);
    font-family: var(--rp-mono);
  }

  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-ok { background: var(--rp-green); box-shadow: 0 0 8px rgba(0,210,106,0.5); }
  .dot-warn { background: var(--rp-amber); box-shadow: 0 0 6px rgba(255,176,0,0.4); }
  .dot-err { background: var(--rp-red); box-shadow: 0 0 8px rgba(225,6,0,0.45); }
  .dot-off { background: var(--rp-ink-faint); }
  .stale-warning { color: var(--rp-amber); font-weight: bold; }

  .last-updated {
    text-align: center;
    font-family: var(--rp-mono);
    font-size: 11px;
    color: var(--rp-ink-faint);
    padding: 16px;
    margin-top: 16px;
  }

  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    color: var(--rp-gunmetal);
    font-size: 13px;
    gap: 10px;
  }
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--rp-border);
    border-top-color: var(--rp-red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

  .footer {
    text-align: center;
    font-family: var(--rp-mono);
    padding: 24px;
    color: var(--rp-ink-faint);
    font-size: 11px;
    border-top: 1px solid var(--rp-border);
    margin-top: 24px;
  }

  @media (max-width: 640px) {
    .header { flex-direction: column; gap: 8px; }
    .pod-grid { grid-template-columns: 1fr; }
    .kv-grid { gap: 12px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <h1>Racing <span>Point</span></h1>
    <span class="header-tag">Status</span>
  </div>
  <div class="header-right">
    <a href="/portal" class="back-link">&larr; Portal</a>
    <div class="header-clock" id="clock">--:--:-- IST</div>
  </div>
</header>

<div class="main">
  <div class="section-label">Server</div>
  <div id="server-section">
    <div class="loading"><div class="spinner"></div>Loading server health...</div>
  </div>

  <div class="section-label">Services</div>
  <div id="services-section">
    <div class="loading"><div class="spinner"></div>Loading services...</div>
  </div>

  <div class="section-label">Fleet — Pods</div>
  <div id="fleet-section">
    <div class="loading"><div class="spinner"></div>Loading fleet status...</div>
  </div>

  <div class="section-label">Displays</div>
  <div id="displays-section">
    <div class="loading"><div class="spinner"></div>Loading displays...</div>
  </div>

  <div class="section-label">Diagnostics</div>
  <div id="diagnostics-section">
    <div class="loading"><div class="spinner"></div>Loading diagnostics...</div>
  </div>

  <div class="last-updated" id="last-updated"></div>
</div>

<footer class="footer">
  Racing Point eSports &amp; Cafe &mdash; Auto-refreshes every 15s
</footer>

<script>
/* Safe DOM builder — no innerHTML, XSS-safe */
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'className') e.className = v;
      else if (k === 'textContent') e.textContent = v;
      else e.setAttribute(k, v);
    }
  }
  if (children) {
    for (const c of (Array.isArray(children) ? children : [children])) {
      if (typeof c === 'string') e.appendChild(document.createTextNode(c));
      else if (c) e.appendChild(c);
    }
  }
  return e;
}

function dot(cls) {
  return el('span', { className: 'dot ' + cls });
}

const clockFmt = new Intl.DateTimeFormat('en-IN', {
  timeZone: 'Asia/Kolkata',
  hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
});
function updateClock() {
  document.getElementById('clock').textContent = clockFmt.format(new Date()) + ' IST';
}
updateClock();
setInterval(updateClock, 1000);

function makeSignal(ms) {
  if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') {
    return AbortSignal.timeout(ms);
  }
  const c = new AbortController();
  setTimeout(function() { c.abort(); }, ms);
  return c.signal;
}

function timeAgo(isoStr) {
  if (!isoStr) return 'never';
  var diff = Date.now() - new Date(isoStr).getTime();
  if (diff < 0) return 'just now';
  var s = Math.floor(diff / 1000);
  if (s < 60) return s + 's ago';
  var m = Math.floor(s / 60);
  if (m < 60) return m + 'm ago';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  return Math.floor(h / 24) + 'd ago';
}

function fmtUptime(secs) {
  if (!secs && secs !== 0) return '—';
  if (secs < 60) return secs + 's';
  if (secs < 3600) return Math.floor(secs / 60) + 'm';
  var h = Math.floor(secs / 3600);
  var m = Math.floor((secs % 3600) / 60);
  return h + 'h ' + m + 'm';
}

function makeKV(label, value) {
  var wrapper = el('div');
  wrapper.appendChild(el('div', { className: 'kv-label', textContent: label }));
  wrapper.appendChild(el('div', { className: 'kv-value', textContent: value }));
  return wrapper;
}

function makeKVWithDot(label, value, ok) {
  var wrapper = el('div');
  wrapper.appendChild(el('div', { className: 'kv-label', textContent: label }));
  var valEl = el('div', { className: 'kv-value' });
  valEl.appendChild(dot(ok ? 'dot-ok' : 'dot-err'));
  valEl.appendChild(document.createTextNode(' ' + value));
  wrapper.appendChild(valEl);
  return wrapper;
}

function renderServer(data) {
  var section = document.getElementById('server-section');
  section.textContent = '';

  var card = el('div', { className: 'server-card' });
  var isOk = data.status === 'ok';

  var nameDiv = el('div', { className: 'server-name' });
  nameDiv.appendChild(dot(isOk ? 'dot-ok' : 'dot-err'));
  nameDiv.appendChild(document.createTextNode(' RaceControl'));
  card.appendChild(nameDiv);

  var kvGrid = el('div', { className: 'kv-grid' });
  kvGrid.appendChild(makeKV('Status', data.status));
  kvGrid.appendChild(makeKV('Build', data.build_id || '—'));
  kvGrid.appendChild(makeKV('Version', data.version || '—'));
  kvGrid.appendChild(makeKVWithDot('WhatsApp', data.whatsapp || '—', data.whatsapp === 'ok'));
  card.appendChild(kvGrid);

  section.appendChild(card);
}

function renderServices(svcs) {
  var section = document.getElementById('services-section');
  section.textContent = '';

  if (!svcs || Object.keys(svcs).length === 0) {
    section.appendChild(el('div', { className: 'loading', textContent: 'No services registered' }));
    return;
  }

  var grid = el('div', { className: 'svc-grid' });
  for (var name of Object.keys(svcs)) {
    var svc = svcs[name];
    var card = el('div', { className: 'svc-card' });
    var nameDiv = el('div', { className: 'svc-name' });

    if (typeof svc === 'string') {
      nameDiv.appendChild(dot('dot-warn'));
      nameDiv.appendChild(document.createTextNode(' ' + name + ' (' + svc + ')'));
      card.appendChild(nameDiv);
    } else {
      var isOk = svc.status === 'ok';
      nameDiv.appendChild(dot(isOk ? 'dot-ok' : 'dot-err'));
      nameDiv.appendChild(document.createTextNode(' ' + name));
      card.appendChild(nameDiv);
      card.appendChild(el('div', { className: 'svc-latency', textContent: svc.response_ms != null ? svc.response_ms + 'ms' : '—' }));
      card.appendChild(el('div', { className: 'svc-meta', textContent: svc.last_checked || '—' }));
    }
    grid.appendChild(card);
  }
  section.appendChild(grid);
}

function renderFleet(pods) {
  var section = document.getElementById('fleet-section');
  section.textContent = '';

  if (!pods || pods.length === 0) {
    section.appendChild(el('div', { className: 'loading', textContent: 'No pods registered' }));
    return;
  }

  var sorted = pods.slice().sort(function(a, b) { return a.pod_number - b.pod_number; });
  var grid = el('div', { className: 'pod-grid' });

  for (var i = 0; i < sorted.length; i++) {
    var p = sorted[i];
    var ws = p.ws_connected;
    var http = p.http_reachable;
    var cls = (ws && http) ? 'online' : (!ws && !http) ? 'offline' : 'partial';
    var dotCls = cls === 'online' ? 'dot-ok' : cls === 'offline' ? 'dot-err' : 'dot-warn';

    var card = el('div', { className: 'pod-card ' + cls });

    // Header
    var header = el('div', { className: 'pod-header' });
    var nameDiv = el('div', { className: 'pod-name' });
    nameDiv.appendChild(dot(dotCls));
    nameDiv.appendChild(document.createTextNode(' ' + (p.name || ('Pod ' + p.pod_number))));
    header.appendChild(nameDiv);
    header.appendChild(el('div', { className: 'pod-ip', textContent: p.ip_address || '' }));
    card.appendChild(header);

    // Details
    var details = el('div', { className: 'pod-details' });
    var items = [
      ['WS', ws ? 'Connected' : 'Disconnected'],
      ['HTTP', http ? 'Reachable' : 'Unreachable'],
      ['Build', p.build_id || '—'],
      ['Uptime', fmtUptime(p.uptime_secs)],
      ['Seen', timeAgo(p.last_seen)],
      ['Crashes/hr', String(p.crashes_last_hour || 0)]
    ];
    for (var j = 0; j < items.length; j++) {
      var d = el('div', { className: 'pod-detail' });
      d.appendChild(el('b', { textContent: items[j][0] + ' ' }));
      d.appendChild(document.createTextNode(items[j][1]));
      details.appendChild(d);
    }
    card.appendChild(details);

    // Badges
    var badges = [];
    if (p.crash_loop) badges.push(['Crash Loop', 'badge-err']);
    if (p.in_maintenance || p.maintenance_flag) badges.push(['Maintenance', 'badge-warn']);
    if (p.violation_count_24h > 0) badges.push([p.violation_count_24h + ' violations', 'badge-warn']);
    if (p.active_sentinels) {
      for (var k = 0; k < p.active_sentinels.length; k++) {
        badges.push([p.active_sentinels[k], 'badge-warn']);
      }
    }
    if (badges.length > 0) {
      var badgeDiv = el('div', { className: 'pod-badges' });
      for (var b = 0; b < badges.length; b++) {
        badgeDiv.appendChild(el('span', { className: 'badge ' + badges[b][1], textContent: badges[b][0] }));
      }
      card.appendChild(badgeDiv);
    }

    grid.appendChild(card);
  }
  section.appendChild(grid);
}

function renderDisplays(displays) {
  var section = document.getElementById('displays-section');
  section.textContent = '';

  if (!displays || displays.length === 0) {
    section.appendChild(el('div', { className: 'loading', textContent: 'No display machines registered' }));
    return;
  }

  var grid = el('div', { className: 'svc-grid' });
  for (var i = 0; i < displays.length; i++) {
    var d = displays[i];
    var card = el('div', { className: 'svc-card' });
    var nameDiv = el('div', { className: 'svc-name' });
    nameDiv.appendChild(dot(d.online ? 'dot-ok' : 'dot-err'));
    nameDiv.appendChild(document.createTextNode(' ' + (d.display_id || 'display')));
    card.appendChild(nameDiv);
    card.appendChild(el('div', { className: 'svc-latency', textContent: 'Uptime ' + fmtUptime(d.uptime_s) }));
    var seenMs = (d.last_ping_secs_ago || 0) * 1000;
    card.appendChild(el('div', { className: 'svc-meta', textContent: 'Last ping ' + (seenMs < 60000 ? (d.last_ping_secs_ago + 's ago') : Math.floor((d.last_ping_secs_ago || 0) / 60) + 'm ago') }));
    grid.appendChild(card);
  }
  section.appendChild(grid);
}

function renderDiagnostics(fleet) {
  var section = document.getElementById('diagnostics-section');
  section.textContent = '';

  var card = el('div', { className: 'server-card' });
  var kvGrid = el('div', { className: 'kv-grid' });

  var venueOpen = fleet.venue_open;
  kvGrid.appendChild(makeKVWithDot('Venue', venueOpen ? 'Open' : 'Closed', venueOpen === true));

  var churn = fleet.dashboard_ws_churn || {};
  var churnOk = churn.healthy === true;
  kvGrid.appendChild(makeKVWithDot(
    'WS Churn',
    (churn.connects_per_min != null ? churn.connects_per_min : '—') + ' / ' +
      (churn.disconnects_per_min != null ? churn.disconnects_per_min : '—') + ' per min',
    churnOk
  ));

  kvGrid.appendChild(makeKV('Dashboard Clients', String(fleet.dashboard_clients != null ? fleet.dashboard_clients : '—')));

  card.appendChild(kvGrid);
  section.appendChild(card);
}

var fetching = false;
var lastSuccessTime = null;
var consecutiveFailures = 0;

function formatTimestamp(d) {
  return new Intl.DateTimeFormat('en-IN', {
    timeZone: 'Asia/Kolkata',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
    day: '2-digit', month: 'short', year: 'numeric'
  }).format(d);
}

function updateStatus(anySuccess) {
  var statusEl = document.getElementById('last-updated');
  if (anySuccess) {
    lastSuccessTime = new Date();
    consecutiveFailures = 0;
    statusEl.textContent = 'Last updated: ' + formatTimestamp(lastSuccessTime) + ' IST';
    statusEl.className = 'last-updated';
  } else {
    consecutiveFailures++;
    var msg = 'Data stale';
    if (lastSuccessTime) {
      var ago = Math.round((Date.now() - lastSuccessTime.getTime()) / 1000);
      msg += ' — last success ' + (ago < 60 ? ago + 's' : Math.round(ago / 60) + 'm') + ' ago';
    }
    msg += ' (' + consecutiveFailures + ' consecutive failures)';
    statusEl.textContent = msg;
    statusEl.className = 'last-updated stale-warning';
  }
}

function refresh() {
  if (fetching) return;
  fetching = true;
  Promise.allSettled([
    fetch('/api/v1/health', { cache: 'no-store', signal: makeSignal(5000) }).then(function(r) { return r.json(); }),
    fetch('/api/v1/fleet/health', { cache: 'no-store', signal: makeSignal(5000) }).then(function(r) { return r.json(); }),
  ]).then(function(results) {
    var anySuccess = false;

    if (results[0].status === 'fulfilled') {
      renderServer(results[0].value);
      anySuccess = true;
    } else {
      var s = document.getElementById('server-section');
      s.textContent = '';
      var card = el('div', { className: 'server-card' });
      var nameDiv = el('div', { className: 'server-name' });
      nameDiv.appendChild(dot('dot-err'));
      nameDiv.appendChild(document.createTextNode(' Unreachable'));
      card.appendChild(nameDiv);
      s.appendChild(card);
    }

    if (results[1].status === 'fulfilled') {
      var fleet = results[1].value;
      renderServices(fleet.services || {});
      renderFleet(fleet.pods || []);
      renderDisplays(fleet.displays || []);
      renderDiagnostics(fleet);
      anySuccess = true;
    } else {
      document.getElementById('services-section').textContent = 'Failed to load services';
      document.getElementById('fleet-section').textContent = 'Failed to load fleet';
      document.getElementById('displays-section').textContent = 'Failed to load displays';
      document.getElementById('diagnostics-section').textContent = 'Failed to load diagnostics';
    }

    updateStatus(anySuccess);
  }).finally(function() { fetching = false; });
}

refresh();
var timer = setInterval(refresh, 15000);
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible') {
    refresh();
    if (!timer) timer = setInterval(refresh, 15000);
  } else {
    clearInterval(timer);
    timer = null;
  }
});
</script>
</body>
</html>
