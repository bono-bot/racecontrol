# rc-process-manager/process_registry.toml
#
# Declarative ownership manifest for every process class the RacingPoint fleet
# legally spawns or kills. Edited in LOCKSTEP with the `ManagedProcess` enum in
# src/process.rs — W5 bidirectional CI gate enforces variant ⇄ entry parity and
# fails a commit that drifts one without the other.
#
# Wave 2 seed set (plan_process_manager_crate_20260423.md §Wave 2). Extend per
# migration need as Wave 4 caller PRs land.
#
# Q3 resolution (Uday 2026-04-23): permissive allowlist pre-Venu-go-live — all
# entries carry `survives_daily_reset = true`. Post-launch tightening flips the
# selected variants (WindowsTerminal, orphan Msedge, openconsole family) to
# `false` without any schema change.
#
# Field semantics
#   process               — ManagedProcess variant (PascalCase, must match enum)
#   owner_crate           — the single crate that is permitted to invoke
#                           `ProcessManager::request_spawn` for this variant.
#                           Value "system" = no Rust owner; lifecycle is external
#                           (Windows service, installer, or user action).
#   max_instances         — W7 scan loop kills extras beyond this count for
#                           `respawn_policy = "singleton"`; `"managed"` logs
#                           only; `"owner-managed"` is not enforced by manager.
#   respawn_policy        — "singleton" | "managed" | "owner-managed"
#   survives_daily_reset  — W8 daily-pod-reset schtask reads this. true = kept
#                           at 04:00 IST; false = killed. Pre-Venu: all true.
#   notes                 — free-form; keep short.

schema_version = 1

[[entry]]
process = "Steam"
owner_crate = "steam_launcher"
max_instances = 1
respawn_policy = "singleton"
survives_daily_reset = true
notes = "Steam client for Content Manager MP launches"

