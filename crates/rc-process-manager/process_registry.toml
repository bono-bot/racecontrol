[[entry]]
process = "Msedge"
owner_crate = "system"
max_instances = 1
respawn_policy = "singleton"
survives_daily_reset = true
notes = "msedge.exe orphan class; single legitimate instance is the Kiosk (tracked separately); any additional instance is a Wave 4/W6 lint failure"

[[entry]]
process = "WindowsTerminal"
owner_crate = "system"
max_instances = 0
respawn_policy = "singleton"
survives_daily_reset = true
notes = "Pod 1 WindowsTerminal 488-proc orphan tree observed 2026-04-23; max_instances=0 marks any running as a violation. survives=true kept pre-Venu per Q3."
