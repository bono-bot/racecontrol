process = "AssettoCorsa2"
owner_crate = "ac_launcher"
max_instances = 1
respawn_policy = "singleton"
survives_daily_reset = true
notes = "acs.exe — SP direct spawn via ac_launcher; MP goes through AcManager"

[[entry]]
process = "RcAgent"
owner_crate = "rc_sentry"
max_instances = 1
respawn_policy = "owner-managed"
survives_daily_reset = true
notes = "rc-agent respawn owned by rc-sentry; manager MUST NOT auto-kill"

[[entry]]
process = "RcSentry"
owner_crate = "rc_watchdog"
max_instances = 1
respawn_policy = "owner-managed"
survives_daily_reset = true
notes = "rc-sentry managed by Windows service rc-watchdog.exe"

[[entry]]
process = "ConspitLink"
