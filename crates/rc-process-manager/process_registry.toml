max_instances = 1
respawn_policy = "singleton"
survives_daily_reset = true
notes = "ConspitLink2.0.exe wheelbase driver; multi-owner bug (Pod 6 ×2 2026-04-22) is the driving case for this crate"

[[entry]]
process = "Kiosk"
owner_crate = "rc_agent"
max_instances = 1
respawn_policy = "singleton"
survives_daily_reset = true
notes = "Edge kiosk (customer-facing fullscreen browser)"

[[entry]]
process = "AcManager"
owner_crate = "ac_launcher"
max_instances = 1
