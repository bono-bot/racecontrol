[package]
name = "rc-installer"
version.workspace = true
edition.workspace = true

[features]
# Opt-in to building the Windows-only V1 pendrive [[bin]] (src/main.rs:13
# `#[cfg(not(windows))] compile_error!`). OFF by default so `cargo test` /
# `cargo check` on a Linux dev host build only the trust-core lib + integration
# tests — selecting an integration test otherwise forces the bin to compile
# (cargo builds package binaries so integration tests can exec them via
# CARGO_BIN_EXE_*). Windows / CI / the Tauri increment build with
# `--features installer-bin`.
installer-bin = []

# Opt-in HTTP redeem client (INC-2). Gated so the default `--lib` build stays
# pure (no network/TLS deps); enable with `--features redeem_client`.
redeem_client = ["dep:ureq"]

[[bin]]
name = "rc-installer"
path = "src/main.rs"
required-features = ["installer-bin"]

[lib]
name = "rc_installer"
path = "src/lib.rs"

[dependencies]
# Trust core (V2 web-distributed installer). The V1 [[bin]] above is pure-std
# Windows-only (#[cfg(not(windows))] compile_error!) and does not use these;
# they serve the lib (ed25519 + sha256 release-trust verification, spec §7).
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
ed25519-dalek = { workspace = true }
# INC-7a: decode the base64 wire signature on SignedLicenseHeartbeat (the heartbeat
# envelope uses base64; ReleaseManifest uses hex). Pure-Rust, cross-compiles to gnu.
base64 = "0.22"

# INC-2 redeem client (optional, behind the `redeem_client` feature). ureq:
# tiny, blocking, rustls — clean `x86_64-pc-windows-gnu` cross-compile, no async
# runtime. Default `--lib`/`--tests` builds do not pull it in.
ureq = { version = "3", optional = true }
