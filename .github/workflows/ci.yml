name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # rc-sentry-ai's ort-sys dependency compiles ONNX Runtime C++ from source via
  # cc-rs and emits __imp_<crt_fn> dllimport references (expects dynamic CRT).
  # Without this flag, windows-latest's MSVC toolchain resolves libucrt.lib
  # (static CRT) instead of the import lib, leaving 33 unresolved externals
  # (LNK1120). Matches the known-working local build recipe on James .27.
  # See memory/project_camera_architecture.md and ci run 24181655147.
  RUSTFLAGS: "-C target-feature=-crt-static"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build all (default features)
        run: cargo build --workspace

      - name: Test rc-common
        run: cargo test -p rc-common

      - name: Test rc-agent
        run: cargo test -p rc-agent-crate

      - name: Test racecontrol
        run: cargo test -p racecontrol-crate

      - name: Clippy (all workspace)
        # Rust 1.93/1.95 tightened style lints across multiple crates. Option B-extended
        # (2026-04-21): auto-fix handled 60% of the workspace (~60 files). Remaining
        # categories are tracked as ratcheting-lint baseline — re-enforce crate-by-crate
        # as follow-up phases land. When a crate is fully cleaned, the corresponding
        # -A can be removed.
        run: cargo clippy --workspace -- -D warnings
          -A clippy::too_many_arguments -A clippy::type_complexity
          -A clippy::unnecessary_map_or -A clippy::useless_format
          -A clippy::collapsible_if -A clippy::io_other_error
          -A clippy::redundant_guards -A clippy::manual_is_multiple_of
          -A clippy::single_match
          -A clippy::field_reassign_with_default -A clippy::empty_line_after_doc_comments
          -A clippy::manual_clamp -A clippy::nonminimal_bool
          -A clippy::match_like_matches_macro -A clippy::doc_lazy_continuation
          -A clippy::doc_overindented_list_items -A clippy::inconsistent_digit_grouping
          -A clippy::assertions_on_constants -A clippy::vec_init_then_push
          -A clippy::if_same_then_else -A clippy::should_implement_trait
          -A clippy::manual_strip -A clippy::duplicated_attributes
          -A clippy::overly_complex_bool_expr -A clippy::erasing_op
          -A clippy::unnecessary_sort_by -A clippy::unnecessary_cast
          -A clippy::while_let_loop -A clippy::unnecessary_literal_unwrap
          -A clippy::unnecessary_get_then_check -A clippy::same_item_push
          -A clippy::redundant_pattern_matching -A clippy::needless_update
          -A clippy::needless_range_loop -A clippy::needless_late_init
          -A clippy::module_inception -A clippy::match_single_binding
          -A clippy::len_without_is_empty -A clippy::empty_line_after_outer_attr
          -A clippy::duplicate_mod -A clippy::needless_return -A clippy::no_effect
          -A clippy::identity_op -A clippy::absurd_extreme_comparisons
          -A clippy::manual_range_contains -A clippy::unnecessary_unwrap
          -A clippy::collapsible_match -A clippy::manual_checked_ops
          -A dead_code -A unused_assignments -A unreachable_code -A unused_macros
          -A unused_imports -A unused_variables -A unused_attributes -A unused_mut
          -A unused_comparisons -A irrefutable_let_patterns

      # Minimal-features and explicit-default builds retired (2026-04-22).
      # Per CLAUDE.md single-binary-tier policy: "The --no-default-features
      # build exists for CI verification and future testing scenarios only —
      # it is NEVER deployed to production pods." Currently rc-agent has
      # unconditional `reqwest` usage that only compiles with default-features
      # enabled (17× E0433 on CI 24753082579). Rather than gate every
      # reqwest call-site, we retire the --no-default-features CI steps and
      # rely on `Build all (default features)` above to prove the workspace
      # compiles in the production configuration. Reinstate when a genuine
      # no-default-features consumer emerges.
      #
      # - name: Build rc-agent (minimal features)
      #   run: cargo build -p rc-agent-crate --no-default-features
      #
      # - name: Build rc-sentry (minimal features)
      #   run: cargo build -p rc-sentry --no-default-features
      #
      # - name: Build rc-agent (default features - explicit)
      #   run: cargo build -p rc-agent-crate
      #
      # - name: Build rc-sentry (default features - explicit)
      #   run: cargo build -p rc-sentry
