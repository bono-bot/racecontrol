name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # rc-sentry-ai's ort-sys dependency compiles ONNX Runtime C++ from source via
  # cc-rs and emits __imp_<crt_fn> dllimport references (expects dynamic CRT).
  # Without this flag, windows-latest's MSVC toolchain resolves libucrt.lib
  # (static CRT) instead of the import lib, leaving 33 unresolved externals
  # (LNK1120). Matches the known-working local build recipe on James .27.
  # See memory/project_camera_architecture.md and ci run 24181655147.
  RUSTFLAGS: "-C target-feature=-crt-static"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build all (default features)
        run: cargo build --workspace

      - name: Test rc-common
        run: cargo test -p rc-common

      - name: Test rc-agent
        run: cargo test -p rc-agent-crate

      - name: Test racecontrol
        run: cargo test -p racecontrol-crate

      - name: Clippy (all workspace)
        # Rust 1.95 tightened several style lints that currently fire across multiple crates
        # (rc-installer, rc-guardian, ai-debugger, rc-process-guard). Option B from PR #4
        # review: suppress the style-only categories to unblock build CI while fix-everything
        # PRs (#4 rc-common, #5 rc-installer, follow-ups) land crate-by-crate. When a crate
        # is fully cleaned, the corresponding -A can be removed to re-enforce the lint.
        run: cargo clippy --workspace -- -D warnings -A clippy::too_many_arguments -A clippy::type_complexity -A clippy::unnecessary_map_or -A clippy::useless_format -A clippy::collapsible_if -A clippy::io_other_error -A clippy::redundant_guards -A clippy::manual_is_multiple_of -A clippy::single_match

      - name: Build rc-agent (minimal features)
        run: cargo build -p rc-agent-crate --no-default-features

      - name: Build rc-sentry (minimal features)
        run: cargo build -p rc-sentry --no-default-features

      - name: Build rc-agent (default features - explicit)
        run: cargo build -p rc-agent-crate

      - name: Build rc-sentry (default features - explicit)
        run: cargo build -p rc-sentry
