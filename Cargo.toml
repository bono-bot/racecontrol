[workspace]
resolver = "2"
members = [
    "crates/rc-common",
    "crates/racecontrol",
    "crates/rc-agent",
    "crates/rc-watchdog",
    "crates/rc-installer",
    "crates/rc-sentry",
    "crates/weekly-report",
    "crates/rc-process-guard",
    "crates/rc-sentry-ai",
    "crates/rc-guardian",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["RacingPoint <bono@racingpoint.in>"]
repository = "https://github.com/racingpoint/racecontrol"

[workspace.dependencies]
# Shared across crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
toml = "0.8"
jsonwebtoken = "9"
rand = "0.8"
argon2 = "0.5"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# rc-common
rc-common = { path = "crates/rc-common" }

# Disable incremental compilation for release builds.
# Root cause: Cargo's incremental cache doesn't invalidate when build.rs
# changes rustc-env values (GIT_HASH). The build script reruns and outputs
# the new hash, but Cargo skips recompilation because no SOURCE files changed.
# This caused deployed binaries to report stale build_id despite new commits.
# Full cargo clean (49GB) was the only workaround. This one-line fix eliminates
# the entire class of bugs. Dev builds still use incremental for speed.
[profile.release]
incremental = false
